[project]
name = "modsync"
version = "0.1.0"
description = "Forum-backed mod archive downloader"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "packaging>=24.0",
  "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
