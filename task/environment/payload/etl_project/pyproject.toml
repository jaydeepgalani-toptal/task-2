[project]
name = "shipment-loader"
version = "0.1.0"
description = "Vendor shipment ledger normalization pipeline"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.1",
  "python-dateutil>=2.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
